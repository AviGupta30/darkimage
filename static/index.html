<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Image Enhancement (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gradient-to-br from-slate-200 to-gray-300 text-gray-800 min-h-screen font-sans p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">
                 Dark Image Enhancement
            </h1>
            <p class="text-lg text-gray-600">
                
            </p>
        </header>

        <div class="bg-white rounded-lg shadow-xl p-6 mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-6 border border-gray-200">
            <div class="flex-1">
                <label for="imageUploader" class="block text-sm font-medium text-gray-700 mb-2">Upload your dark image:</label>
                <input 
                    type="file" 
                    id="imageUploader" 
                    accept="image/*"
                    class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 transition"
                >
            </div>
            <button 
                id="enhanceButton"
                class="w-full md:w-auto px-8 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-lg hover:bg-indigo-700 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                disabled
            >
                <svg id="button-spinner" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="button-text">Enhance Image</span>
            </button>
        </div>

        <div id="loading-spinner" class="text-center p-16 hidden">
            <div role="status">
                <svg class="inline w-12 h-12 text-gray-500 animate-spin" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                    </svg>
                <span class="block mt-4 text-lg text-gray-600">Enhancing image, please wait...</span>
            </div>
        </div>

        <div id="viewer-area" class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 hidden">
            <div class="image-box">
                <h2 class="image-title">Original Image</h2>
                <div class="image-well">
                    <canvas id="originalCanvas" class="rounded-md"></canvas>
                    <p id="originalMessage" class="message-text">Upload an image to start</p>
                </div>
            </div>

            <div class="image-box">
                <h2 id="enhanced-title" class="image-title">Enhanced</h2>
                <div class="image-well">
                    <canvas id="enhancedCanvas" class="rounded-md"></canvas>
                    <p id="enhancedMessage" class="message-text">Enhanced image will appear here</p>
                </div>
            </div>
        </div>

        <div id="output-selector" class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4 hidden">
            <span class="text-lg font-medium text-gray-700">Select Enhancement Strength:</span>
            <div class="flex gap-2">
                <button id="btn-1x" class="output-btn active">1x Pass</button>
                <button id="btn-2x" class="output-btn">2x Passes</button>
                <button id="btn-3x" class="output-btn">3x Passes</button>
            </div>
        </div>
        
        <div id="brightness-controls" class="mt-4 flex flex-wrap justify-center items-center gap-4 hidden">
            <span class="text-lg font-medium text-gray-700">For 1x Pass Only:</span>
            <button 
                id="btn-brighten"
                class="px-4 py-2 rounded-md font-semibold text-sm bg-amber-500 text-white hover:bg-amber-600 transition disabled:opacity-50"
            >
                Increase Brightness (+25%)
            </button>
            <button 
                id="btn-darken"
                class="px-4 py-2 rounded-md font-semibold text-sm bg-sky-600 text-white hover:bg-sky-700 transition disabled:opacity-50"
            >
                Decrease Brightness (-25%)
            </button>
        </div>
        </div>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 hidden z-50">
        <img id="modalImage" src="" alt="Zoomed Image" class="max-w-[90vw] max-h-[90vh] object-contain rounded-lg">
        <button id="closeModal" class="absolute top-4 right-6 text-white text-5xl font-bold opacity-80 hover:opacity-100 transition">&times;</button>
    </div>

    <script src="/script.js"></script>
</body>
</html>
